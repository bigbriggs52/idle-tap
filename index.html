<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silicon Valley Tycoon</title>
<meta name="theme-color" content="#f1f6f8">
<meta name="description" content="Idle tycoon game: run an underground R&D electronics lab.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SV Tycoon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap">

</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/balance.js"></script>
<script src="js/raid.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/rush.js"></script>
<script src="js/vault.js"></script>
<script>
  SVT.boot();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    // When a new version's worker takes over, reload once so the new files are used right away.
    var hadWorker = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadWorker && !reloaded) { reloaded = true; SVT.save(); location.reload(); }
    });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
    }).catch(function () {});
  }
</script>
</body>
</html>
